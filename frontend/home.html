<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Candidate Brief</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="global-navbar">
        <div class="brand">
            <i data-lucide="layout-grid" class="logo-icon"></i>
            <span>Unified Candidate Brief</span>
        </div>

        <div class="nav-right">
            <div class="actions">
                <button class="btn-outline" onclick="window.print()">
                    <i data-lucide="printer"></i> Print Report
                </button>
            </div>
        </div>
    </nav>

    <div class="app-layout">
        
        <aside class="sidebar">
            <div class="sidebar-content">
                
                <div class="panel-section">
                    <div class="section-title toggle-btn" onclick="toggleSection('job-context-panel', 'job-chevron')">
                        <span><i data-lucide="briefcase"></i> Job Context</span>
                        <i id="job-chevron" data-lucide="chevron-down" width="16"></i>
                    </div>
                    
                    <div id="job-context-panel" style="display:block;">
                        <div style="display:flex; gap:8px; margin-bottom: 12px;">
                            <select id="job-select" class="input-sm" style="flex:1;" onchange="loadJobDescription()">
                                <option value="">-- Create New / Select --</option>
                            </select>
                            <button onclick="showNewJobForm()" class="input-sm" style="width:36px; padding:0; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                                <i data-lucide="plus" style="width:16px;"></i>
                            </button>
                        </div>

                        <div id="job-editor-area" style="display: none; border-top:1px dashed #e2e8f0; padding-top:12px;">
                            <div style="margin-bottom: 8px;">
                                <input type="text" id="job-title-input" class="input-sm" placeholder="Job Title">
                            </div>
                            <div style="margin-bottom: 8px;">
                                <textarea id="job-desc-input" rows="5" class="input-sm" placeholder="Requirements..."></textarea>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <button onclick="saveJobProfile()" class="btn-card primary" style="flex:1; justify-content:center;">Save</button>
                                <button onclick="hideJobForm()" class="btn-outline" style="padding:8px;">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <div class="upload-zone-compact" id="drop-area">
                        <div class="icon-box"><i data-lucide="plus"></i></div>
                        <div class="text-box">
                            <strong>Upload Candidates</strong>
                            <span>PDF only</span>
                        </div>
                    </div>
                    <input type="file" id="file-input" accept=".pdf" multiple style="display: none;">
                </div>

                <div class="panel-section">
                    <div class="section-title toggle-btn" onclick="toggleSection('filter-panel', 'filter-chevron')">
                        <span><i data-lucide="filter"></i> Filter & Sort</span>
                        <i id="filter-chevron" data-lucide="chevron-down" width="16"></i>
                    </div>
                    
                    <div id="filter-panel" style="display:block;">
                        <div style="text-align: right; margin-bottom: 8px;">
                            <span class="reset-link" onclick="resetFilters()" style="font-size: 0.75rem;">Reset Filters</span>
                        </div>

                        <div class="search-box" style="margin-bottom: 8px;">
                            <i data-lucide="search" size="14" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
                            <input type="text" id="search-input" class="input-sm" style="padding-left: 32px;" placeholder="Search Name or Skills">
                        </div>

                        <div style="margin-bottom: 8px;">
                            <select id="sort-select" class="input-sm" onchange="applyFilters()">
                                <option value="score_desc">Score High to Low</option>
                                <option value="name_asc">Name A - Z</option>
                                <option value="name_desc">Name Z - A</option>
                                <option value="exp_desc">Experience Most to Least</option>
                            </select>
                        </div>

                        <div class="filter-row" style="display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
                            <label>Min Score: <span id="score-val" style="font-weight:600; color:var(--primary);">0%</span></label>
                            <input type="range" class="range-slider" id="score-slider" min="0" max="100" value="0" style="width: 60%;">
                        </div>
                    </div>
                </div>

                <div class="separator-horizontal" style="margin: 16px 0;"></div>

                <div class="panel-section results-section">
                    <div class="section-title toggle-btn" onclick="toggleSection('uploaded-panel', 'uploaded-chevron')">
                        <span id="results-count-label"><i data-lucide="users"></i> Uploaded (0)</span>
                        <i id="uploaded-chevron" data-lucide="chevron-down" width="16"></i>
                    </div>
                    
                    <div id="uploaded-panel" style="display:block;">
                        <div class="candidate-list" id="candidate-list"></div>
                    </div>
                </div>

            </div>
        </aside>

        <main class="main-content">

            <div id="main-dashboard-wrapper">

                <div id="comparison-area-wrapper">
                    <section class="comparison-section">
                        <div class="section-header-row">
                            <div class="section-title static">
                                <span><i data-lucide="layers"></i> Active Comparison (<span id="compare-count">0</span>/4)</span>
                            </div>
                            
                            <button class="btn-clear-all" onclick="clearComparison()">
                                <i data-lucide="trash-2"></i>
                                <span>Clear All</span>
                            </button>
                        </div>
                        
                        <div id="comparison-container" class="cards-container">
                        </div>
                    </section>
                </div>

            <div id="resizer-handle"></div>

            <div id="pool-area-wrapper">
        
                <div class="separator-horizontal"></div>

                    <section class="pool-section">
                        <div class="section-header-row">
                            <div class="section-title static">
                                <span><i data-lucide="database"></i> Candidate Pool (<span id="pool-count">0</span>)</span>
                            </div>

                            <button class="btn-clear-all" onclick="deleteAllCandidates()">
                                <i data-lucide="trash-2"></i>
                                <span>Delete All</span>
                            </button>
                        </div>
                        
                        <div class="table-container">
                            <table class="candidate-table">
                                <thead>
                                    <tr>
                                        <th width="50">Select</th> 
                                        <th>Candidate Name / Role</th>
                                        <th>Match Score</th>
                                        <th>Experience</th>
                                        <th>Key Skills</th>
                                        <th width="60">Del</th>
                                    </tr>
                                </thead>
                                
                                <tbody id="candidate-tbody">
                                </tbody>
                                
                            </table>
                        </div>
                    </section>
                </div>
            </div>    
            
            <div id="resume-modal" class="modal-overlay" onclick="closeResumeModal()">
                <div class="modal-content" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h3 id="modal-title">📄 Resume Preview</h3>
                        <button class="btn-icon" onclick="closeResumeModal()"><i data-lucide="x"></i></button>
                    </div>
                    <div class="modal-body">
                        <iframe id="resume-frame" src=""></iframe>
                    </div>
                </div>
            </div>

            <div id="analysis-modal" class="modal-overlay" onclick="closeAnalysisModal()">
                <div class="modal-content large-modal" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="big-avatar small" id="ana-avatar">A</div>
                            <div>
                                <h3 id="ana-name">Candidate Name</h3>
                                <p style="margin:0; font-size:0.8rem; color:#64748B;" id="ana-role">Position</p>
                            </div>
                        </div>
                        <button class="btn-icon" onclick="closeAnalysisModal()"><i data-lucide="x"></i></button>
                    </div>
                    
                    <div class="modal-body-analysis">
                        <div class="ana-chart-box">
                            <canvas id="skillsChart"></canvas>
                        </div>
                        <div class="ana-text-box">
                            <h4><i data-lucide="bot"></i> AI Executive Summary</h4>
                            <div class="summary-content" id="ana-summary">Loading...</div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
